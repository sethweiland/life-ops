# Fly.io config for the life-ops shell.
# Production ops.sethweiland.com still runs meme-ops from sethweiland/memes.
# Do not `fly deploy` this repo onto meme-ops until cutover (see README).
app = "meme-ops"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
